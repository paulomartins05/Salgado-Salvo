<svg width="500" height="120" viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&amp;family=Inter:wght@700&amp;display=swap');
    .word { font-family: 'Playfair Display', Georgia, serif; font-weight: 800; font-size: 40px; fill: #3A4729; }
    .tag  { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 2px; fill: #C1442C; }
  </style>

  <!-- selo -->
  <g transform="translate(10,10)">
    <circle cx="50" cy="50" r="46" fill="#3A4729" stroke="#FBF6EA" stroke-width="3.5" stroke-dasharray="5 6"/>
    <g transform="rotate(-10 50 50)">
      <path d="M50,25 C65,29 72,45 67,60 C63,75 50,82 50,82 C50,82 37,75 33,60 C28,45 35,29 50,25 Z"
            fill="#FBF6EA"/>
      <path d="M50,32 L50,76" stroke="#3A4729" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M50,44 C44,46 40,50 38,55" stroke="#3A4729" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M50,44 C56,46 60,50 62,55" stroke="#3A4729" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M50,82 C48,87 46,90 43,93" stroke="#FBF6EA" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- nome -->
  <text x="128" y="60" class="word">Salgado Salvo</text>
  <text x="130" y="82" class="tag">CONTRA O DESPERDÍCIO</text>
</svg>
